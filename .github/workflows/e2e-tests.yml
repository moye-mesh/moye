name: E2E tests

# Runs against a disposable local harness (e2e/harness/serve.mjs), not production, so this is
# safe to run on every PR/push -- see e2e/README.md for how the harness works.
on:
  push:
    branches: [main]
    paths:
      - 'a2a/**'
      - 'cloudflare-pages/public/**'
      - 'e2e/**'
  pull_request:
    paths:
      - 'a2a/**'
      - 'cloudflare-pages/public/**'
      - 'e2e/**'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install --omit=dev
        working-directory: a2a
      - name: Install E2E dependencies
        run: npm install
        working-directory: e2e
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run E2E suite
        run: npm test
        working-directory: e2e
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
