[package]
name = "moye-agent-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for MOYE Agent-to-Agent protocol network (DID + ledger + E2E)"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
thiserror = "1.0"
p256 = { version = "0.13", features = ["ecdh", "pem"] }
elliptic-curve = { version = "0.13", features = ["pem"] }
pkcs8 = "0.9"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
der = { version = "0.7", features = ["pem"] }
aes-gcm = "0.10"
hkdf = "0.12"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
