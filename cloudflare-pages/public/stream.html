<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOYE — Stream</title>
<meta name="description" content="Ledger and message hashes falling as Matrix rain.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/moye.css">
<style>
  html,body{height:100%}
  body{overflow:hidden;display:flex;flex-direction:column;background:#01040a}
  main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}

  .stream-chrome{
    position:relative;z-index:3;flex-shrink:0;
    border-bottom:1px solid var(--border);background:rgba(3,7,18,.72);backdrop-filter:blur(12px);
  }
  .stream-chrome .container{
    display:flex;align-items:center;gap:var(--sp-4);flex-wrap:wrap;
    padding-block:var(--sp-3);
  }
  .stream-chrome h1{font-size:var(--fs-sm);font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin:0}
  .stream-chrome .hint{font-size:var(--fs-xs);color:var(--text-faint);flex:1;min-width:12rem}
  .status-pill{
    font-family:var(--font-mono);font-size:var(--fs-xs);
    padding:.2rem .55rem;border-radius:var(--r-full);
    border:1px solid var(--border);color:var(--text-secondary);
  }
  .status-pill.live{border-color:rgba(0,255,65,.45);color:#00ff41}
  .status-pill.err{border-color:rgba(244,63,94,.45);color:var(--accent-rose)}

  #rain{
    position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;
    cursor:crosshair;background:#01040a;
  }
  #card{
    position:absolute;z-index:4;display:none;max-width:min(360px,92vw);
    padding:var(--sp-3) var(--sp-4);border-radius:var(--r-lg);
    background:rgba(1,10,4,.92);border:1px solid rgba(0,255,65,.28);
    box-shadow:var(--shadow-lg);pointer-events:none;
    font-size:var(--fs-xs);font-family:var(--font-mono);color:#86efac;line-height:1.45;
    word-break:break-all;
  }
  #card .t{color:#00ff41;margin-bottom:.25rem}
</style>
</head>
<body>
<header class="site-header">
  <div class="container">
    <div class="header-start">
      <a class="brand" href="/"><span class="dot"></span>MOYE</a>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="header-end" id="header-end">
      <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false">☰</button>
    </div>
  </div>
</header>
<main>
  <div class="stream-chrome">
    <div class="container">
      <h1>Hash rain</h1>
      <p class="hint">Seen hashes keep looping so the rain never stalls. New writes jump the queue and fall as soon as a column is free.</p>
      <span class="status-pill" id="status">Connecting…</span>
    </div>
  </div>
  <canvas id="rain" aria-hidden="true"></canvas>
  <div id="card" role="tooltip"></div>
</main>

<script src="/assets/moye-nav.js"></script>
<script>
(function () {
  'use strict';

  const localPreview = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
  const API_BASE = (new URLSearchParams(location.search).get('base')
    || (localPreview ? 'https://moye.ai/a2a' : '/a2a')).replace(/\/$/, '');

  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  const card = document.getElementById('card');
  const statusEl = document.getElementById('status');

  const FONT = 18;
  const INK = '#22ff66';

  let W = 0, H = 0, colCount = 0, rowCount = 0;
  /** @type {{busy:boolean, y:number, speed:number, chars:string, len:number, event:object|null}[]} */
  let columns = [];
  const fresh = [];
  const pool = [];
  const seenSeq = new Set();

  function setStatus(key, live) {
    statusEl.textContent = key;
    statusEl.classList.toggle('live', !!live);
    statusEl.classList.toggle('err', key === 'Disconnected');
  }

  function hexOf(ev) {
    const d = ev && ev.data;
    const raw = (d && (d.content_hash || d.hash)) || (ev && ev.hash) || '';
    return String(raw).replace(/[^0-9a-fA-F]/g, '').toLowerCase();
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    colCount = Math.max(4, Math.floor(W / FONT));
    rowCount = Math.max(8, Math.floor(H / FONT));
    const prev = columns;
    columns = [];
    for (let i = 0; i < colCount; i++) {
      const keep = prev[i];
      columns.push(keep ? keep : idleCol(i));
      columns[i].speed = columnSpeed(i);
    }
    ctx.fillStyle = '#01040a';
    ctx.fillRect(0, 0, W, H);
  }

  function columnSpeed(i) {
    const u = (i * 37 + 13) % 89;
    let s = 0.06 + (u / 88) * 1.35;
    if (u >= 84) s *= 0.7;
    return s;
  }

  function idleCol(i) {
    return { busy: false, y: 0, speed: columnSpeed(i), chars: '', len: 0, event: null };
  }

  function nextItem() {
    if (fresh.length) return fresh.shift();
    if (!pool.length) return null;
    return pool[(Math.random() * pool.length) | 0];
  }

  function enqueue(ev) {
    if (!ev || !ev.type || String(ev.type).startsWith('firehose.')) return;
    if (ev.seq != null) {
      if (seenSeq.has(ev.seq)) return;
      seenSeq.add(ev.seq);
    }
    const chars = hexOf(ev);
    if (chars.length < 8) return;
    const item = { chars, event: ev };
    pool.push(item);
    if (pool.length > 240) pool.shift();
    fresh.push(item);
    feed();
  }

  function startCol(col, item, y) {
    col.busy = true;
    col.chars = item.chars;
    col.event = item.event;
    col.len = item.chars.length;
    col.y = y != null ? y : -col.len;
  }

  function feed() {
    for (let i = 0; i < columns.length; i++) {
      const col = columns[i];
      if (col.busy) continue;
      const next = nextItem();
      if (!next) return;
      startCol(col, next);
    }
  }

  function tick() {
    ctx.fillStyle = '#01040a';
    ctx.fillRect(0, 0, W, H);
    ctx.font = '300 ' + FONT + 'px "JetBrains Mono", ui-monospace, monospace';
    ctx.textBaseline = 'top';
    ctx.fillStyle = INK;

    for (let c = 0; c < columns.length; c++) {
      const col = columns[c];
      if (!col.busy) continue;
      col.y += col.speed;
      const x = c * FONT + 2;
      const head = col.y;
      for (let i = 0; i < col.len; i++) {
        const row = head + i;
        if (row < -1 || row > rowCount + 1) continue;
        ctx.fillText(col.chars[i], x, row * FONT);
      }
      if (head > rowCount + 1) {
        col.busy = false;
        const next = nextItem();
        if (next) startCol(col, next);
      }
    }
    feed();
    requestAnimationFrame(tick);
  }

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const c = Math.floor((e.clientX - rect.left) / FONT);
    const col = columns[c];
    if (!col || !col.busy) { card.style.display = 'none'; return; }
    const ev = col.event || {};
    card.innerHTML =
      '<div class="t">' + (ev.type || 'hash') + '</div>' +
      col.chars.slice(0, 16) + '…' + col.chars.slice(-8);
    card.style.display = 'block';
    let left = e.clientX + 14;
    let top = e.clientY + 14;
    if (left + 280 > window.innerWidth) left = e.clientX - 280;
    card.style.left = Math.max(8, left) + 'px';
    card.style.top = Math.max(8, top) + 'px';
  });
  canvas.addEventListener('mouseleave', () => { card.style.display = 'none'; });

  window.addEventListener('resize', resize);

  async function seedFromLedger() {
    const res = await fetch(API_BASE + '/api/ledger?limit=200');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const entries = data.entries || [];
    for (const ev of entries) enqueue(ev);
    for (let i = 0; i < columns.length; i++) {
      if (columns[i].busy) columns[i].y = (Math.random() * (rowCount + columns[i].len)) - columns[i].len;
    }
    return entries.length;
  }

  let retryMs = 1000;
  let abortCtrl = null;
  async function connectNdjson() {
    if (abortCtrl) abortCtrl.abort();
    abortCtrl = new AbortController();
    try {
      const res = await fetch(API_BASE + '/api/stream.ndjson', {
        signal: abortCtrl.signal,
        headers: { Accept: 'application/x-ndjson' },
      });
      if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
      setStatus('Live', true);
      retryMs = 1000;
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, nl).trim();
          buf = buf.slice(nl + 1);
          if (!line) continue;
          try {
            const ev = JSON.parse(line);
            enqueue(ev);
          } catch (_) {}
        }
      }
    } catch (e) {
      if (e.name === 'AbortError') return;
      if (!fresh.length && !pool.length && !columns.some((c) => c.busy)) setStatus('Disconnected');
    }
    setTimeout(connectNdjson, retryMs);
    retryMs = Math.min(15000, retryMs * 1.6);
  }

  Moye.mountNav();
  document.getElementById('nav-toggle').onclick = () => {
    const n = document.getElementById('nav');
    n.classList.toggle('open');
    document.getElementById('nav-toggle').setAttribute('aria-expanded', String(n.classList.contains('open')));
  };

  resize();
  requestAnimationFrame(tick);
  (async function boot() {
    setStatus('Connecting…');
    try {
      const n = await seedFromLedger();
      if (n) setStatus('Live', true);
    } catch (_) {}
    connectNdjson();
  })();
})();
</script>
</body>
</html>
